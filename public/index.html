```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Justin AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(900px, 95vw);
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 280px;
      height: 280px;
      margin: auto;
      border-radius: 50%;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 3px solid #444;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message {
      margin: 25px auto;
      min-height: 60px;
      max-width: 700px;
      font-size: 20px;
      color: #ddd;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
      margin: 5px;
    }

    #talk {
      background: white;
      color: black;
    }

    #stop {
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>JUSTIN AI</h1>

    <div class="avatar">
      <div style="font-size:80px;">👤</div>
    </div>

    <div class="message" id="message">
      Hi! I'm Justin AI.
    </div>

    <button id="talk">🎤 TALK TO JUSTIN</button>
    <button id="stop">🔇 STOP</button>

  </div>

  <script>
    const message = document.getElementById("message");
    const talkButton = document.getElementById("talk");
    const stopButton = document.getElementById("stop");

    let recognition;

    if ("webkitSpeechRecognition" in window) {
      recognition = new webkitSpeechRecognition();

      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = "en-US";

      recognition.onresult = async function(event) {
        const text = event.results[0][0].transcript;

        message.textContent = "You: " + text;

        try {
          message.textContent = "Justin AI is thinking...";

          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: text
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Request failed");
          }

          message.textContent = data.reply;

          const speech = new SpeechSynthesisUtterance(data.reply);
          speech.rate = 1;
          speech.pitch = 1;

          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(speech);

        } catch (error) {
          console.error(error);
          message.textContent =
            "Something went wrong connecting to Justin AI.";
        }
      };

      recognition.onerror = function(event) {
        console.error(event);
        message.textContent = "I couldn't hear you. Try again.";
      };
    }

    talkButton.onclick = function() {
      if (!recognition) {
        message.textContent =
          "Voice recognition isn't supported in this browser.";
        return;
      }

      message.textContent = "🎤 Listening...";

      try {
        recognition.start();
      } catch (error) {
        console.log(error);
      }
    };

    stopButton.onclick = function() {
      if (recognition) {
        recognition.stop();
      }

      window.speechSynthesis.cancel();
      message.textContent = "Stopped.";
    };
  </script>

</body>
</html>
